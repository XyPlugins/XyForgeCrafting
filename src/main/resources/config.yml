# XyForgeCrafting 1.0.6
# 仅支持 Paper/Spigot 1.12.2 与 Java 8，不使用 DragonCore GUI。
# type 对应功能完整说明
# BACKGROUND：锁定的背景装饰槽，同时作为火焰动画的移动路径。
# FORGE_REQUIREMENTS：锻造材料展示槽。
# 放入有效图纸后，按照GUI布局从上到下、从左到右显示所需材料、需要数量和玩家拥有数量。
# FORGE_BLUEPRINT：锻造图纸槽。
# 只能放入带有XyForgeCrafting固定隐藏NBT身份的有效图纸，整个GUI必须且只能配置一个。
# FORGE_START：开始锻造按钮。
# 显示锻造成功率、失败率和金币需求，点击后检查条件并播放锻造动画，整个GUI必须且只能配置一个。
# FORGE_PROBABILITY：锻造概率展示槽。
# 放入有效图纸后，依次显示锻造失败概率和各个结果的最终概率，至少需要配置一个。
# FORGE_RESULT：锻造成品预览槽。
# 放入有效图纸后显示该配方对应的XyItems成品及其交付数量。
# CLOSE：关闭锻造台按钮。
# 点击后关闭GUI，并将尚未消耗的锻造图纸安全退回玩家背包。

gui:
  title: '&8锻造台'
  # 每行必须正好9个字符，共1到6行；空格也是锁定槽位。
  layout:
    - '111111111'
    - '141333331'
    - '111333331'
    - '111111111'
    - '151612171'
    - '111111111'

  # 字符组件。布局中只允许一个 FORGE_BLUEPRINT 槽位。
  cons:
    '1':
      type: BACKGROUND
      display:
        material: STAINED_GLASS_PANE
        data: 15
        name: '&8锻造台边框'
        lore:
          - '&7锻造之火正在沉睡。'
    '2':
      type: FORGE_START
      display:
        material: ANVIL
        name: '&a点击开始锻造'
        lore:
          - '&7放入有效图纸后可开始。'
    '3':
      type: FORGE_REQUIREMENTS
      display:
        material: BARRIER
        name: '&7等待图纸'
        lore:
          - '&8放入图纸后显示所需材料。'
    '4':
      type: FORGE_BLUEPRINT
      display:
        material: EMPTY_MAP
        name: '&e放入锻造图纸'
        lore:
          - '&7这里只接受带有固定隐藏身份的图纸。'
    '5':
      type: FORGE_PROBABILITY
      display:
        material: INK_SACK
        data: 8
        name: '&7等待概率'
        lore:
          - '&8放入图纸后显示锻造概率。'
    '6':
      type: FORGE_RESULT
      display:
        material: CHEST
        name: '&6锻造成品'
        lore:
          - '&8放入图纸后显示成品。'
    '7':
      type: CLOSE
      display:
        material: BARRIER
        name: '&c关闭锻造台'
        lore:
          - '&7未使用的图纸会安全退回。'

animation:
  enabled: true
  # 三套内置轻量动画路径：
  # BORDER_CONVERGE：两路沿GUI边框推进，最后汇合到右下角。
  # BOTTOM_SWEEP：仅底部边框从左向右推进。
  # DOUBLE_SWEEP：顶部和底部边框同时从左向右推进。
  active-preset: BORDER_CONVERGE
  interval-ticks: 1
  loops: 1
  # 当前帧头部，默认亮绿色玻璃。
  head:
    material: STAINED_GLASS_PANE
    data: 5
    name: '&a锻造之火'
  # 已经走过的路径，默认深绿色玻璃。
  trail:
    material: STAINED_GLASS_PANE
    data: 13
    name: '&2锻造余焰'

# 锻造成功后写入成品末尾的锻造记录；旧配置缺少本段时也会使用这些默认值。
forge-record:
  enabled: true
  timezone: 'Asia/Shanghai'
  time-format: 'yyyy-MM-dd HH:mm:ss'
  # true表示最后一行只是分隔线时先删除，再插入下面的新锻造区块。
  replace-last-separator: true
  lore:
    - '&7------------[ &c锻造&7 ]--------------'
    - '&e锻造者：&7%player_name%'
    - '&e锻造时间：&7%forge_time%'
    - '&7----------------------------------'

messages:
  prefix: '&7[&6XyForgeCrafting&7]&r '
  no-permission: '&c你没有权限执行这个操作。'
  player-only: '&c该命令只能由玩家执行。'
  opened: '&a已打开锻造台。'
  not-blueprint: '&c当前放入的不是图纸。'
  blueprint-invalid: '&c图纸身份无效或对应配方未启用。'
  blueprint-occupied: '&c图纸槽中已经有一张图纸。'
  inventory-full: '&c背包至少需要一个空格，无法开始锻造。'
  requirements-missing: '&c材料不足，无法开始锻造。'
  money-missing: '&c金币不足，无法开始锻造。'
  economy-unavailable: '&cVault经济服务不可用。'
  probability-missing: '&c成品没有有效的锻造失败/品质权重。'
  display-overflow: '&c该配方的材料超过GUI可展示槽位，已拒绝锻造。'
  already-forging: '&c锻造正在进行中。'
  forge-success: '&a锻造成功！获得了 %result_name%。'
  forge-failure: '&c锻造失败。'
  transaction-failed: '&c锻造事务未能完成，已返还可恢复的投入。'
  reload-success: '&a锻造配置重载成功。'
  reload-failed: '&c锻造配置重载失败，已保留当前配置。请查看控制台。'
  pending-return: '&e背包空间不足，图纸或退款物品已进入安全待领取队列。'
  pending-delivered: '&a已领取此前未能退回的锻造图纸。'
